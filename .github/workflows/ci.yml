name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: export
            paths: >-
              tests/test_openscad.py
              tests/test_cadquery.py
              tests/test_freecad.py
              tests/test_csg.py
              tests/test_extrusion.py
              tests/test_side_features.py
              tests/test_sweep.py
              tests/test_partial_arc.py
              tests/test_torus.py
          - group: geometry
            paths: >-
              tests/test_roundtrip.py
              tests/test_fillets.py
              tests/test_coarse.py
              tests/test_seams.py
              tests/test_io_cli.py
              tests/test_slots.py
              tests/test_bolt_circles.py
              tests/test_hole_patterns.py
              tests/test_bracket_holes.py
              tests/test_outline_bosses.py
              tests/test_outline_fillet.py
              tests/test_outline_holes.py
              tests/test_params.py
              tests/test_mcp.py
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Test (${{ matrix.group }})
        run: pytest -q -n auto -m "not slow" ${{ matrix.paths }}
  byte-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile on the oldest supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q src
