name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is site/ plus the docs pages and images, so the URLs
      # served from docs/ before (faq.html, limits.html, demo.gif) stay the same.
      - name: Assemble site
        run: |
          mkdir -p _staging
          cp -r site/. _staging/
          cp docs/*.md docs/*.gif docs/*.png _staging/
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_staging
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
