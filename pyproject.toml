[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh2cad"
version = "0.8.0"
description = "Convert STL/OBJ/PLY meshes into STEP, CadQuery, and OpenSCAD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["trimesh", "rtree", "networkx", "numpy", "scipy", "cadquery-ocp>=7.8,<8"]

[project.optional-dependencies]
mcp = ["mcp"]
cadquery = ["cadquery"]
dev = ["pytest", "cadquery", "mcp"]

[project.scripts]
mesh2cad = "mesh2cad.cli:main"
