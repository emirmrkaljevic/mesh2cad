[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh2cad"
version = "0.16.0"
description = "Convert STL/OBJ/PLY meshes into STEP, CadQuery, OpenSCAD, and FreeCAD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["trimesh", "rtree", "networkx", "numpy", "scipy", "cadquery-ocp>=7.8,<8"]

[project.urls]
Homepage = "https://emirmrkaljevic.github.io/mesh2cad/"
Source = "https://github.com/emirmrkaljevic/mesh2cad"
Issues = "https://github.com/emirmrkaljevic/mesh2cad/issues"
Changelog = "https://github.com/emirmrkaljevic/mesh2cad/releases"
"Example gallery" = "https://huggingface.co/spaces/mesh2cad/mesh2cad"

[project.optional-dependencies]
mcp = ["mcp"]
cadquery = ["cadquery"]
dev = ["pytest", "cadquery", "mcp"]

[project.scripts]
mesh2cad = "mesh2cad.cli:main"
